name: Publish to npm

on:
  push:
    branches: [main, "1.x"]
    paths: [package.json]

  # Lets a release be re-driven without a no-op package.json commit, for
  # example after a failed run has been fixed.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install -g npm@latest

      - name: Write semver comparison helper
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/semver-compare.mjs" <<'EOF'
          // Prints -1 / 0 / 1 for process.argv[2] compared to process.argv[3].
          // Hand-rolled so the workflow needs no dependencies.
          const parse = (raw) => {
              const v = String(raw).trim().replace(/^v/, "")
              const m = /^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$/.exec(v)
              if (!m) throw new Error("Unparseable semver version: " + raw)
              return {
                  core: [Number(m[1]), Number(m[2]), Number(m[3])],
                  pre: m[4] ? m[4].split(".") : null,
              }
          }

          const compare = (aRaw, bRaw) => {
              const a = parse(aRaw)
              const b = parse(bRaw)
              for (let i = 0; i < 3; i++) {
                  if (a.core[i] !== b.core[i]) return a.core[i] < b.core[i] ? -1 : 1
              }
              // A version without a prerelease outranks the same core with one.
              if (!a.pre && !b.pre) return 0
              if (!a.pre) return 1
              if (!b.pre) return -1
              const len = Math.max(a.pre.length, b.pre.length)
              for (let i = 0; i < len; i++) {
                  const x = a.pre[i]
                  const y = b.pre[i]
                  if (x === undefined) return -1
                  if (y === undefined) return 1
                  const xNum = /^\d+$/.test(x)
                  const yNum = /^\d+$/.test(y)
                  if (xNum && yNum) {
                      if (Number(x) !== Number(y)) return Number(x) < Number(y) ? -1 : 1
                  } else if (xNum !== yNum) {
                      return xNum ? -1 : 1
                  } else if (x !== y) {
                      return x < y ? -1 : 1
                  }
              }
              return 0
          }

          process.stdout.write(String(compare(process.argv[2], process.argv[3])))
          EOF
          node "$RUNNER_TEMP/bin/semver-compare.mjs" 1.0.0 1.0.0 >/dev/null

      - name: Resolve version, dist-tag, and publish decision
        id: release
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          LOCAL_VERSION=$(node -p "require('./package.json').version")
          if ! printf '%s' "$LOCAL_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::package.json version '$LOCAL_VERSION' is not a semver version"
            exit 1
          fi
          MAJOR=${LOCAL_VERSION%%.*}

          # Dist-tag comes from the major version, so a 1.x release can never
          # take the 'latest' tag away from the 2.x line.
          if [ "$MAJOR" -ge 2 ]; then
            DIST_TAG=latest
          elif [ "$MAJOR" -eq 1 ]; then
            DIST_TAG=release-1.x
          else
            echo "::error::Refusing to publish major version $MAJOR; expected 1 (maintenance) or >= 2 (current)"
            exit 1
          fi

          # The branch and the major version must agree, otherwise a stale 1.x
          # version landing on main would silently publish onto the maintenance
          # tag (or worse, a 2.x on the maintenance branch would take 'latest').
          case "$BRANCH" in
            main)
              if [ "$DIST_TAG" != "latest" ]; then
                echo "::error::main publishes the 'latest' line, but version $LOCAL_VERSION resolves to dist-tag '$DIST_TAG'. Release 1.x versions from the 1.x branch."
                exit 1
              fi
              ;;
            1.x)
              if [ "$DIST_TAG" != "release-1.x" ]; then
                echo "::error::the 1.x branch publishes the 'release-1.x' line, but version $LOCAL_VERSION resolves to dist-tag '$DIST_TAG'. Release 2.x+ versions from main."
                exit 1
              fi
              ;;
            *)
              echo "::error::Unexpected branch '$BRANCH'; publishing is only configured for main and 1.x"
              exit 1
              ;;
          esac

          # Ask whether this exact version exists, not what 'latest' points at.
          set +e
          VERSIONS_JSON=$(npm view hypnosound versions --json 2>"$RUNNER_TEMP/npm-view.err")
          VIEW_STATUS=$?
          set -e
          if [ "$VIEW_STATUS" -ne 0 ]; then
            if grep -q 'E404' "$RUNNER_TEMP/npm-view.err"; then
              echo "Package not found on the registry; treating this as the first publish."
              VERSIONS_JSON='[]'
            else
              echo "::error::'npm view hypnosound versions' failed; refusing to guess whether $LOCAL_VERSION is published"
              cat "$RUNNER_TEMP/npm-view.err"
              exit 1
            fi
          fi

          PUBLISHED=$(
            LOCAL_VERSION="$LOCAL_VERSION" VERSIONS_JSON="$VERSIONS_JSON" node -e '
              const raw = JSON.parse(process.env.VERSIONS_JSON)
              const versions = Array.isArray(raw) ? raw : [raw]
              process.stdout.write(versions.includes(process.env.LOCAL_VERSION) ? "true" : "false")
            '
          )

          CURRENT_LATEST=$(npm view hypnosound version 2>/dev/null || echo "")

          echo "local=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          echo "current_latest=$CURRENT_LATEST" >> "$GITHUB_OUTPUT"

          {
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| branch | \`$BRANCH\` |"
            echo "| local version | \`$LOCAL_VERSION\` |"
            echo "| dist-tag | \`$DIST_TAG\` |"
            echo "| already published | \`$PUBLISHED\` |"
            echo "| current \`latest\` | \`${CURRENT_LATEST:-none}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse downgrade of the latest dist-tag
        if: steps.release.outputs.dist_tag == 'latest' && steps.release.outputs.published == 'false'
        env:
          LOCAL_VERSION: ${{ steps.release.outputs.local }}
          CURRENT_LATEST: ${{ steps.release.outputs.current_latest }}
        run: |
          set -euo pipefail

          if [ -z "$CURRENT_LATEST" ]; then
            echo "No current 'latest' on the registry; nothing to downgrade."
            exit 0
          fi

          ORDER=$(node "$RUNNER_TEMP/bin/semver-compare.mjs" "$LOCAL_VERSION" "$CURRENT_LATEST")
          if [ "$ORDER" != "1" ]; then
            echo "::error::Refusing to move the 'latest' dist-tag from $CURRENT_LATEST to $LOCAL_VERSION; the new version must be strictly greater."
            exit 1
          fi
          echo "$LOCAL_VERSION > $CURRENT_LATEST; safe to move 'latest'."

      - name: Publish
        if: steps.release.outputs.published == 'false'
        env:
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: npm publish --provenance --access public --tag "$DIST_TAG"

      - name: Skip
        if: steps.release.outputs.published == 'true'
        run: echo "Version ${{ steps.release.outputs.local }} is already published, skipping"
