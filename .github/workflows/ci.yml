name: CI

on:
  push:
    branches: [main, "1.x"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7

      # Pinned on purpose. `version: latest` resolved to pnpm 11, which
      # requires the node:sqlite builtin, and that broke the 2.0.0 release
      # run against Node 20. Bump this deliberately, not implicitly.
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test
